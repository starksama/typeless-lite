<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recording Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        --overlay-bg-top: oklch(27% 0.014 225 / 0.96);
        --overlay-bg-bottom: oklch(21% 0.013 225 / 0.94);
        --overlay-text: oklch(93% 0.009 225);
        --overlay-muted: oklch(74% 0.016 225);
        --overlay-border: oklch(72% 0.02 225 / 0.22);
        --overlay-track: oklch(16% 0.013 225);
        --overlay-track-mark: oklch(100% 0 0 / 0.06);
        --overlay-accent: oklch(76% 0.09 166);
        --overlay-warning: oklch(70% 0.116 72);
        --overlay-shadow: 0 18px 46px oklch(8% 0.018 235 / 0.32);
        --overlay-texture: oklch(100% 0 0 / 0.018);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --overlay-bg-top: oklch(99% 0.004 220 / 0.96);
        --overlay-bg-bottom: oklch(91% 0.008 220 / 0.94);
        --overlay-text: oklch(24% 0.014 225);
        --overlay-muted: oklch(46% 0.019 225);
        --overlay-border: oklch(42% 0.02 225 / 0.2);
        --overlay-track: oklch(89% 0.01 225);
        --overlay-track-mark: oklch(24% 0.012 225 / 0.06);
        --overlay-accent: oklch(43% 0.086 170);
        --overlay-warning: oklch(55% 0.112 72);
        --overlay-shadow: 0 18px 46px oklch(18% 0.018 235 / 0.15);
        --overlay-texture: oklch(24% 0.012 225 / 0.03);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        pointer-events: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      .overlay-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .overlay-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 13px;
        border-radius: 12px;
        border: 1px solid var(--overlay-border);
        background:
          repeating-linear-gradient(90deg, var(--overlay-texture) 0 1px, transparent 1px 7px),
          linear-gradient(180deg, var(--overlay-bg-top), var(--overlay-bg-bottom));
        box-shadow: var(--overlay-shadow);
        color: var(--overlay-text);
        opacity: 0;
        transform: translateY(8px) scale(0.98);
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .overlay-pill.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .overlay-pill[data-tone="recording"] {
        border-color: var(--overlay-accent);
      }

      .overlay-pill[data-tone="processing"] {
        border-color: var(--overlay-warning);
      }

      .overlay-icon {
        position: relative;
        width: 34px;
        height: 14px;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid var(--overlay-border);
        border-radius: 5px;
        background:
          repeating-linear-gradient(90deg, transparent 0 5px, var(--overlay-track-mark) 5px 6px),
          var(--overlay-track);
      }

      .overlay-icon-dot {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 8px;
        height: 6px;
        border-radius: 2px;
        background: var(--overlay-muted);
        transition:
          transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
          background-color 140ms ease;
      }

      .overlay-pill[data-tone="recording"] .overlay-icon-dot {
        transform: translateX(9px);
        background: var(--overlay-accent);
      }

      .overlay-pill[data-tone="processing"] .overlay-icon-dot {
        transform: translateX(18px);
        background: var(--overlay-warning);
      }

      .overlay-label {
        font-size: 13px;
        font-weight: 540;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .overlay-meter {
        display: none;
        align-items: end;
        gap: 3px;
        height: 16px;
      }

      .overlay-pill[data-tone="recording"] .overlay-meter {
        display: inline-flex;
      }

      .overlay-bar {
        width: 3px;
        min-height: 4px;
        border-radius: 2px;
        background: var(--overlay-accent);
        transition: height 90ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0ms !important;
          transition-duration: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay-shell">
      <div id="overlay-pill" class="overlay-pill" data-tone="idle" aria-hidden="true">
        <div class="overlay-icon" aria-hidden="true">
          <div class="overlay-icon-dot"></div>
        </div>
        <div id="overlay-label" class="overlay-label">Ready</div>
        <div id="overlay-meter" class="overlay-meter" aria-hidden="true">
          <span class="overlay-bar"></span>
          <span class="overlay-bar"></span>
          <span class="overlay-bar"></span>
          <span class="overlay-bar"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
