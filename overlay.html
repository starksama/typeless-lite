<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recording Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        --overlay-blue: oklch(72% 0.145 255);
        --overlay-mint: oklch(73% 0.12 166);
        --overlay-dot-dim: oklch(78% 0.012 240 / 0.32);
        --overlay-level: 0;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --overlay-blue: oklch(54% 0.16 255);
        --overlay-mint: oklch(58% 0.13 166);
        --overlay-dot-dim: oklch(22% 0.012 240 / 0.3);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      .overlay-shell {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }

      .overlay-pill {
        display: grid;
        place-items: center;
        width: 104px;
        height: 22px;
        opacity: 0;
        transform: translateY(3px) scale(0.98);
        transition:
          opacity 120ms ease,
          transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .overlay-pill.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .overlay-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        height: 100%;
      }

      .overlay-dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: var(--overlay-dot-dim);
        opacity: 0.42;
        transform: translate3d(0, 0, 0) scale(0.78);
        transition:
          opacity 85ms linear,
          transform 85ms cubic-bezier(0.22, 1, 0.36, 1),
          background-color 120ms ease;
      }

      .overlay-pill[data-tone="recording"] .overlay-dot {
        animation: dot-flow 1120ms linear infinite;
        background: var(--overlay-mint);
      }

      .overlay-pill[data-tone="recording"].has-speech .overlay-dot {
        background: color-mix(in oklch, var(--overlay-mint) 86%, var(--overlay-blue));
      }

      .overlay-dot:nth-child(2) {
        animation-delay: -960ms;
      }

      .overlay-dot:nth-child(3) {
        animation-delay: -800ms;
      }

      .overlay-dot:nth-child(4) {
        animation-delay: -640ms;
      }

      .overlay-dot:nth-child(5) {
        animation-delay: -480ms;
      }

      .overlay-dot:nth-child(6) {
        animation-delay: -320ms;
      }

      .overlay-dot:nth-child(7) {
        animation-delay: -160ms;
      }

      .overlay-spinner {
        display: none;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        border: 2px solid oklch(62% 0.012 240 / 0.18);
        border-top-color: var(--overlay-blue);
        animation: overlay-spin 760ms linear infinite;
      }

      .overlay-pill[data-tone="processing"] .overlay-dots {
        display: none;
      }

      .overlay-pill[data-tone="processing"] .overlay-spinner {
        display: block;
      }

      @keyframes dot-flow {
        0%,
        100% {
          opacity: 0.32;
        }
        42% {
          opacity: 0.82;
        }
      }

      @keyframes overlay-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0ms !important;
          transition-duration: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay-shell">
      <div id="overlay-pill" class="overlay-pill" data-tone="idle" aria-hidden="true" aria-label="Ready">
        <div class="overlay-dots" aria-hidden="true">
          <span class="overlay-dot"></span>
          <span class="overlay-dot"></span>
          <span class="overlay-dot"></span>
          <span class="overlay-dot"></span>
          <span class="overlay-dot"></span>
          <span class="overlay-dot"></span>
          <span class="overlay-dot"></span>
        </div>
        <span class="overlay-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
